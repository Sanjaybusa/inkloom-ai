type = "story"
title = "Add custom campaign analysis input"
description = "Let judges replace seeded campaign copy with their own campaign text and run the governance analysis."
verify = "Enter custom text, run analysis, and see the submitted text represented in the workspace findings."
covers = ["R2"]
after = [1]
hitl = false
risk = "medium"
refine = true

[[entry]]
id = 3
type = "story"
title = "Deliver a downloadable Evidence Passport"
description = "Generate a portable evidence artifact from the approval result and provide a working download action."
