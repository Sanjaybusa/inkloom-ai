[[entry]]
id = 1
type = "story"
title = "Complete the no-login campaign tracing path"
description = "Wire one seeded campaign from public input through findings, evidence, approval, and passport preview so a judge can see the complete workflow."
verify = "From the public dashboard, run the sample analysis, open evidence, approve the review, and view the generated passport."
covers = ["R1", "R3", "R4"]
after = []
hitl = false
risk = "high"
refine = true
plan_checkpoint = true

[[entry]]
